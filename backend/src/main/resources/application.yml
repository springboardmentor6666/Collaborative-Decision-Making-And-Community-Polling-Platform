server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: decisionhub-backend
  
  # Database Configuration (PostgreSQL)
  datasource:
    url: jdbc:postgresql://localhost:5432/decisionhub_db
    username: postgres
    password: Spring#2327
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # JPA & Hibernate Settings
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
    open-in-view: false

  # Flyway Migration Settings
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration





# Custom Application Properties
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A}
      expiration-ms: 86400000 # 24 hours (1 day)
      refresh-token-expiration-ms: 604800000 # 7 days
      issuer: decisionhub-api


  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers: "*"
    exposed-headers:
      - Authorization
      - Content-Disposition
    allow-credentials: true

# OpenAPI / Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

# Actuator Endpoint Management
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always

# Logging Levels
logging:
  level:
    root: INFO
    com.decisionhub: DEBUG
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
