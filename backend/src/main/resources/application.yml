server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: decisionhub-backend
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope: openid,profile,email
            redirect-uri: http://localhost:8080/login/oauth2/code/google
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/decisionhub_db;DB_CLOSE_DELAY=-1;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:${SPRING_DATASOURCE_DRIVER_CLASS_NAME:}}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: false

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:noreply@decisionhub.com}
    password: ${SPRING_MAIL_PASSWORD:password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${APP_MAIL_FROM:noreply@decisionhub.com}
  firebase:
    config-path: ${FIREBASE_CONFIG_PATH:}
    enabled: ${FIREBASE_ENABLED:false}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
    api-key: ${CLOUDINARY_API_KEY:1234567890}
    api-secret: ${CLOUDINARY_API_SECRET:secret}
    enabled: ${CLOUDINARY_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    root: INFO
    com.decisionhub: INFO
    org.hibernate: INFO
    org.hibernate.orm.deprecation: ERROR
    org.springframework.security.config.annotation.authentication.configurers.userdetails.InitializeUserDetailsManagerConfigurer: ERROR
