# ==============================================================================
# Development Profile (application-dev.yml)
# Used for local development and debugging
# ==============================================================================

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  # Local Development Database
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/decisionhub_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:Spring#2327}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # Hibernate ddl-auto for development convenience
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

# Dev Application Settings
application:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A}
    oauth2:
      google:
        client-id: ${GOOGLE_CLIENT_ID:702442008383-5cuppuqs826ofhvmio3m0k7q53u0m8cu.apps.googleusercontent.com}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Development Actuator
management:
  endpoint:
    health:
      show-details: always

# Detailed Logging for Development
logging:
  level:
    root: INFO
    com.decisionhub: DEBUG
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
