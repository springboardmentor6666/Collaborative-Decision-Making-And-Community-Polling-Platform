# Spring Application settings
spring.application.name=decisionhub-backend

# Server port configuration
server.port=8081

# Database Configuration (H2 In-Memory Development Database)
spring.datasource.url=jdbc:h2:mem:decisionhub;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console configuration (accessible at http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA and Hibernate configuration for H2
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Run schema.sql initialization (optional, if ddl-auto is update it creates tables automatically,
# but we configure it to run schema.sql for explicit control if requested)
spring.sql.init.mode=never

# Comma-separated frontend origins. Override with CORS_ALLOWED_ORIGINS when deploying.
decisionhub.app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# JWT Properties
decisionhub.app.jwtSecret=decisionHubSecretKeyMustBeLongEnoughForHS256AlgorithmToWorkSuccessfully2026!
decisionhub.app.jwtExpirationMs=86400000
