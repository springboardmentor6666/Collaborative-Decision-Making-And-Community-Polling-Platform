# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/decisionhub
spring.datasource.username=root
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

# Server
server.port=8080

# Default admin bootstrap credentials. Override with environment variables.
app.admin.name=${ADMIN_NAME:DecisionHub Admin}
app.admin.email=${ADMIN_EMAIL:admin@decisionhub.local}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# ==============================
# Google OAuth2
# ==============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}