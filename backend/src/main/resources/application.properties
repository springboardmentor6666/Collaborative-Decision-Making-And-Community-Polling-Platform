# ==============================
# MySQL Database Configuration
# ==============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==============================
# HikariCP Connection Pool
# ==============================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=DecisionHubHikariCP

# ==============================
# Server
# ==============================
server.port=${PORT:8080}

# ==============================
# Default admin bootstrap credentials
# ==============================
app.admin.name=${ADMIN_NAME:DecisionHub Admin}
app.admin.email=${ADMIN_EMAIL:admin@decisionhub.local}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
# Google OAuth2
# ==============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}