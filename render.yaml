# ==============================================================================
# DecisionHub - Collaborative Decision-Making & Community Polling Platform
#
# Render Blueprint Specification (render.yaml)
# Enables 1-Click deployment of the Spring Boot backend on Render Free Tier
# ==============================================================================

services:
  - type: web
    name: decisionhub-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_DRIVER
        value: org.postgresql.Driver
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: -XX:+UseSerialGC -Xss512k -XX:MaxRAMPercentage=70.0 -Xmx320m
      - key: H2_CONSOLE_ENABLED
        value: "false"
      - key: HIKARI_KEEPALIVE_TIME
        value: "30000"
      - key: HIKARI_MAX_LIFETIME
        value: "600000"
