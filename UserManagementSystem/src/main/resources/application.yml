server:
  port: 8080

spring:
  application:
    name: UserManagementSystem
  config:
    description: User Management System with JWT Authentication
  version: 1.0.0
  datasource:
    url: jdbc:mysql://localhost:3306/user_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  security:
    ignore:
      paths:
        - /swagger-ui/**
        - /v3/api-docs/**
        - /api-docs/**
        - /actuator/**

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000
  refresh-token-expiration-ms: 604800000

password-reset:
  token-expiry-minutes: 15