# Spring Application settings
spring.application.name=decisionhub-backend

# Server port configuration
server.port=8081

# PostgreSQL configuration. Set DB_URL, DB_USERNAME, and DB_PASSWORD in your environment
# before starting the application. The URL defaults to a local database named decisionhub.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/decisionhub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Initialize the supplied PostgreSQL schema on startup. Hibernate then validates it instead
# of silently changing the database structure.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Comma-separated frontend origins. Override with CORS_ALLOWED_ORIGINS when deploying.
decisionhub.app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# JWT Properties
decisionhub.app.jwtSecret=decisionHubSecretKeyMustBeLongEnoughForHS256AlgorithmToWorkSuccessfully2026!
decisionhub.app.jwtExpirationMs=86400000
