services:
  postgres:
    image: postgres:16-alpine
    container_name: decisionhub-postgres
    environment:
      POSTGRES_DB: decisionhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: decisionhub
    ports:
      - "5432:5432"
    volumes:
      - decisionhub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d decisionhub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  decisionhub-postgres-data:
