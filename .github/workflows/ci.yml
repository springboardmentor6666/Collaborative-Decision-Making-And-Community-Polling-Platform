name: CI Pipeline

on:
  push:
    branches: [ main, master, team-two ]
  pull_request:
    branches: [ main, master, team-two ]

jobs:
  # ============================================================================
  # 1. Backend CI: Test & Package Spring Boot Application
  # ============================================================================
  backend-ci:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Unit & Integration Tests
        working-directory: ./backend
        run: mvn test

      - name: Build Production JAR Package
        working-directory: ./backend
        run: mvn package -DskipTests

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/decisionhub-backend-*.jar
          retention-days: 7

  # ============================================================================
  # 2. Frontend CI: Typecheck & Build React SPA Bundle
  # ============================================================================
  frontend-ci:
    name: Frontend (Node 22 / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ============================================================================
  # 3. Docker Validation: Ensure Multi-Stage Docker Builds Pass
  # ============================================================================
  docker-validation:
    name: Docker Builds Check
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: decisionhub-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: decisionhub-frontend:test
          build-args: |
            VITE_API_URL=/api
            VITE_WS_URL=/ws
